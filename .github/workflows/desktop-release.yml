name: Build desktop releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach installers to (for example, v14.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: dist/*.exe
          - platform: macOS
            os: macos-latest
            artifact: dist/*.dmg
          - platform: Linux
            os: ubuntu-latest
            artifact: dist/*.AppImage

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BPM4B-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  attach-to-release:
    name: Attach installers to the release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true

  chocolatey:
    name: Publish Chocolatey package
    runs-on: windows-latest
    needs: build
    if: ${{ vars.PUBLISH_CHOCOLATEY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: BPM4B-Windows
          path: chocolatey/tools
      - name: Pack and publish
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          choco pack chocolatey/bpm4b.nuspec --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey package creation failed.' }
          choco push "bpm4b.$version.nupkg" --api-key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey publish failed.' }
