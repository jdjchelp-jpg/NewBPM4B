name: rust-port
on:
  workflow_dispatch:
jobs:
  port:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm i -g rust-anything @tauri-apps/cli
      - run: rust-anything record rust/lib-rs
      - run: rust-anything build rust/lib-rs
      - run: rust-anything diff rust/lib-rs
      - run: rust-anything gate rust/lib-rs
      - run: cargo tauri build
        working-directory: src-tauri
