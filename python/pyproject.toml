[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpm4b"
version = "14.0.0"
description = "BPM4B — audiobook & audio workspace (delimiter engines + CLI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["audiobook", "m4b", "epub", "chapters", "ffmpeg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Text Processing",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bpm4b = "bpm4b.cli:main"

[tool.setuptools]
packages = ["bpm4b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
